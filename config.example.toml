# Example configuration for fix_server (Wozinga Trading Platform)
# Copy this file to config.toml and fill in environment-specific CompIDs.
# config.toml is git-ignored — never commit it.
# chmod 0600 config.toml
# Never commit secrets. This file names environment variables; it does not hold values.

# ─── Market-data subscriptions ───────────────────────────────────────────────
# Instruments to subscribe to. Each session subscribes to the symbols listed
# here that its own routing admits. Empty means subscribe to nothing.
# Do not subscribe to everything the venue lists: each port lists ~1,100
# instruments and every reconnect re-sends an order-book and a trade request
# for each, which floods the venue and breaks the session.
[subscriptions]
symbols = ["BTC_USDT", "BTC_USD", "BTCUSD-PERP"]

# ─── Credentials (env names only — no values) ────────────────────────────────
# Export the named variables before starting. There is NO default, unlike
# KDB_HOST (which falls back to localhost). Unset / empty / whitespace is FATAL.
[credentials.UAT]
api_key_env    = "CRYPTOCOM_API_KEY"
api_secret_env = "CRYPTOCOM_API_SECRET"

# ─── Sessions ────────────────────────────────────────────────────────────────
# Adding a session = append a [[sessions]] table and restart. Zero main.rs change.
#
# Primary-book contract: the first role = "market_data" row is the book for
# tick autosave, ZMQ, algo market leg, and the web Live tab. Do not reorder
# BTC below ETH (or any other MD row) unless you intend to move those books.
# host is a hostname, NOT a URL — do not paste tcp://…

[[sessions]]
name             = "uat_om"
role             = "order_management"
host             = "fix-uat.crypto.com"
port             = 34404
sender_comp_id   = "UAT1.WOZINGA.UD.00"
target_comp_id   = "UAT1.CDC.UD"
credentials_ref  = "UAT"

[[sessions]]
name             = "uat_md_btc"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34402
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = "all"   # first MD row = primary book (autosave / ZMQ / algo / web)

[[sessions]]
name             = "uat_md_others_34405"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34405
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = { first_char_ranges = ["0-9", "A-D"] }

[[sessions]]
name             = "uat_md_others_34406"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34406
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = { first_char_ranges = ["E-M"] }

[[sessions]]
name             = "uat_md_others_34407"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34407
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = { first_char_ranges = ["N-Z"] }

# ─── Connection Tuning ───────────────────────────────────────────────────────
# Per-session heartbeat_interval / max_reconnect_attempts / reconnect_backoff_ms
# may override these; UAT omits them so runtime matches today.
[connection]
heartbeat_interval      = 30
max_reconnect_attempts  = 10
reconnect_backoff_ms    = 1000

# ─── OMS hard risk gates (Road to Live) ─────────────────────────────────────
# Copied into gitignored config.toml; restart required (EL-008). Not secrets.
# Empty / omitted [[symbol_limits]] ⇒ exposure gate OFF (EL-018, deploy-day no-op).
# Once ANY row is present, unknown symbols fail closed (EL-007).
# max_position here is the OMS HARD cap. Algo form #algoCfgMaxPos / POST /api/algo/config
# is a different, REST-mutable SOFT cap in src/algo.rs — do not conflate.
# Numbers below are ILLUSTRATIVE placeholders, not risk sign-off.
# Quotes (USDT/USD/PERP) treated 1:1 for notional/drawdown (EL-012, UAT only).
#
# Residual: unpriced market-by-qty (no Price, no CashOrderQty) skips the notional
# leg and enforces position-only — the OM session has no MD order-book mid.
# Residual: drawdown uses Σ realized_pnl only (no mark-to-market).
# Residual: 35=G amends are not exposure-gated (same as OKS-010).

[[symbol_limits]]
symbol        = "BTC_USDT"
max_position  = 0.05
max_notional  = 5000.0

[[symbol_limits]]
symbol        = "BTC_USD"
max_position  = 0.05
max_notional  = 5000.0

[[symbol_limits]]
symbol        = "BTCUSD-PERP"
max_position  = 0.05
max_notional  = 5000.0

# 0.0 / omitted ⇒ drawdown guard OFF. Finite > 0 arms it. NaN/Inf is a parse error.
[risk]
session_max_drawdown = 0.0

# ─── kdb+ Connection (environment variables — not in this file) ──────────────
# KDB_HOST  (default: localhost)
# KDB_PORT  (default: 5001)
# KDB_RECONNECT_BACKOFF_MS  (default: 1000; doubles to 30000 on failure)
# CAPTURE_SYMBOLS  (default: BTC_USDT; empty/whitespace = capture nothing)
# KDB_LISTEN  (kdb process; default 127.0.0.1; set 0.0.0.0 to bind all interfaces)
# Start the kdb+ server first:  q kdb/start_kdb_server.q

# ─── Trading Algorithm Defaults ──────────────────────────────────────────────
# The algo starts disabled.  Enable it at runtime via POST /api/algo/enable
# or by calling POST /api/algo/config with {"enabled": true, ...}.
#
# [algo]                        (not loaded from config.toml — set via REST API)
# enabled          = false
# symbol           = "BTC_USDT"
# order_qty        = 0.001
# min_spread_bps   = 5.0
# max_position     = 0.01
# poll_interval_ms = 1000
# tick_size        = 0.01
# time_in_force    = "3"
