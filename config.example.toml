# Example configuration for fix_server (Wozinga Trading Platform)
# Copy this file to config.toml and fill in environment-specific CompIDs.
# config.toml is git-ignored — never commit it.
# chmod 0600 config.toml
# Never commit secrets. This file names environment variables; it does not hold values.

# ─── Market-data subscriptions ───────────────────────────────────────────────
# Instruments to subscribe to. Each session subscribes to the symbols listed
# here that its own routing admits. Empty means subscribe to nothing.
# Do not subscribe to everything the venue lists: each port lists ~1,100
# instruments and every reconnect re-sends an order-book and a trade request
# for each, which floods the venue and breaks the session.
[subscriptions]
symbols = ["BTC_USDT", "BTC_USD", "BTCUSD-PERP"]

# ─── Credentials (env names only — no values) ────────────────────────────────
# Export the named variables before starting. There is NO default, unlike
# KDB_HOST (which falls back to localhost). Unset / empty / whitespace is FATAL.
[credentials.UAT]
api_key_env    = "CRYPTOCOM_API_KEY"
api_secret_env = "CRYPTOCOM_API_SECRET"

# ─── Sessions ────────────────────────────────────────────────────────────────
# Adding a session = append a [[sessions]] table and restart. Zero main.rs change.
#
# Primary-book contract: the first role = "market_data" row is the book for
# tick autosave, ZMQ, algo market leg, and the web Live tab. Do not reorder
# BTC below ETH (or any other MD row) unless you intend to move those books.
# host is a hostname, NOT a URL — do not paste tcp://…

[[sessions]]
name             = "uat_om"
role             = "order_management"
host             = "fix-uat.crypto.com"
port             = 34404
sender_comp_id   = "UAT1.WOZINGA.UD.00"
target_comp_id   = "UAT1.CDC.UD"
credentials_ref  = "UAT"

[[sessions]]
name             = "uat_md_btc"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34402
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = "all"   # first MD row = primary book (autosave / ZMQ / algo / web)

[[sessions]]
name             = "uat_md_others_34405"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34405
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = { first_char_ranges = ["0-9", "A-D"] }

[[sessions]]
name             = "uat_md_others_34406"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34406
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = { first_char_ranges = ["E-M"] }

[[sessions]]
name             = "uat_md_others_34407"
role             = "market_data"
host             = "fix-uat.crypto.com"
port             = 34407
sender_comp_id   = "UAT1.WOZINGA.MD.00"
target_comp_id   = "UAT1.CDC.MD"
credentials_ref  = "UAT"
symbol_routing   = { first_char_ranges = ["N-Z"] }

# ─── Connection Tuning ───────────────────────────────────────────────────────
# Per-session heartbeat_interval / max_reconnect_attempts / reconnect_backoff_ms
# may override these; UAT omits them so runtime matches today.
[connection]
heartbeat_interval      = 30
max_reconnect_attempts  = 10
reconnect_backoff_ms    = 1000

# ─── OMS hard risk gates (Road to Live) ─────────────────────────────────────
# Copy these tables into gitignored config.toml. Changing a number takes a
# process restart — the same motion as adding a [[sessions]] row. There is
# no REST to edit these keys, and they are not secrets.
#
# max_position and max_notional here are the hard caps on every new order
# (35=D). The Algo tab field "Max position (base units)" is a separate,
# REST-mutable soft strategy cap. It can differ and does not override these.
#
# Values below are illustrative, not risk sign-off. Tune them in config.toml
# after deploy. Empty or omitted [[symbol_limits]] leaves the exposure gate
# off (deploy-day no-op). Once any row is present, an order for a symbol
# that is not listed is rejected. Seed the three subscribed symbols so the
# algo default BTC_USDT is not a surprise reject.
#
# Quote currencies (USDT / USD / PERP) are treated 1:1 for notional and
# session drawdown in UAT.
#
# A session drawdown halt uses the existing Algo-tab Kill Switch. The chip
# reads Halted and Reset is enabled; the banner does not say "drawdown".
# Diagnose the trigger from process logs.
#
# Residual: an unpriced market-by-qty order (no price, no cash order qty)
# skips the notional check and is position-only — the order-management
# session has no market-data book mid.
# Residual: session drawdown uses the sum of realized P&L only (no
# mark-to-market).
# Residual: 35=G amends are not exposure-gated.

[[symbol_limits]]
symbol        = "BTC_USDT"
max_position  = 0.05
max_notional  = 5000.0

[[symbol_limits]]
symbol        = "BTC_USD"
max_position  = 0.05
max_notional  = 5000.0

[[symbol_limits]]
symbol        = "BTCUSD-PERP"
max_position  = 0.05
max_notional  = 5000.0

# Omit session_max_drawdown, or set it to 0.0 or below, to leave the
# drawdown guard off. A finite value greater than 0 arms it. NaN or Inf
# is a parse error and the process will not start.
[risk]
session_max_drawdown = 0.0

# ─── kdb+ Connection (environment variables — not in this file) ──────────────
# KDB_HOST  (default: localhost)
# KDB_PORT  (default: 5001)
# KDB_RECONNECT_BACKOFF_MS  (default: 1000; doubles to 30000 on failure)
# CAPTURE_SYMBOLS  (default: BTC_USDT; empty/whitespace = capture nothing)
# KDB_LISTEN  (kdb process; default 127.0.0.1; set 0.0.0.0 to bind all interfaces)
# Start the kdb+ server first:  q kdb/start_kdb_server.q

# ─── Trading algorithm (REST, not this file) ─────────────────────────────────
# AlgoConfig is not loaded from config.toml. Set it at runtime:
#   POST /api/algo/config   full AlgoConfig JSON (whole-struct replace)
#   GET  /api/algo/status   read-back of the live config
#   POST /api/algo/enable   /  POST /api/algo/disable
#
# The algo starts disabled. Enable it with POST /api/algo/enable, or POST
# /api/algo/config with "enabled": true plus the rest of the fields.
#
# Self-match prevention (FIX 12362 / 2964 / 2362) lives on that same POST as
# three optional strings. Omit the keys or send null to leave the gate
# inactive — the outbound 35=D then omits the corresponding tag. A partial
# set emits only the present tags. The id is a static per-strategy group
# string, not generated per order.
#
# The Algo tab does not edit these fields. Save still round-trips them from
# the last GET so a dashboard save cannot silently disarm a REST-armed gate.
#
# Illustrative values (not venue sign-off):
#   "self_match_prevention_scope": "S",
#   "self_match_prevention_instruction": "1",
#   "self_match_prevention_id": "42"
#
# [algo]                        (not loaded from config.toml — set via REST API)
# enabled          = false
# symbol           = "BTC_USDT"
# order_qty        = 0.001
# min_spread_bps   = 5.0
# max_position     = 0.01
# poll_interval_ms = 1000
# tick_size        = 0.01
# time_in_force    = "3"
