# Template: Scan-only SDLC Pipeline (no build / no Harbor)
# Use for:
#   - "container" repos that have NO Dockerfile (defer containerization)
#   - iOS / desktop / MQL repos (no cluster build runner) — mirror + scan
#
# Pipeline: Gitleaks -> dep-audit (npm/pip) -> Semgrep -> DefectDojo
# Scanners are NON-blocking: the goal is visibility/findings, not a deploy gate.
# Findings still show as a red step; the job itself stays green so every scanner runs.
#
# Required org secret: DEFECTDOJO_TOKEN  (already set on wozinga-group)

name: SDLC Scan (no build)

on:
  push:
    branches: [main, master]
  # Without this, a PR carries no status at all and "green CI" can never be
  # confirmed before merge — scans only ran after the code was already in.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (Gitleaks)
        continue-on-error: true
        run: |
          GL_VER=$(curl -sf https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'][1:])")
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source=. --redact --exit-code 1

      - name: Dependency audit (npm)
        if: ${{ hashFiles('package.json') != '' }}
        continue-on-error: true
        run: |
          npm install --package-lock-only --ignore-scripts 2>/dev/null || true
          npm audit --audit-level=critical --omit=dev

      - name: Dependency audit (pip)
        if: ${{ hashFiles('requirements.txt') != '' }}
        continue-on-error: true
        run: |
          python3 -m venv /tmp/auditenv
          /tmp/auditenv/bin/pip install -q --upgrade pip pip-audit
          /tmp/auditenv/bin/pip-audit -r requirements.txt --format markdown || true

      - name: SAST (Semgrep)
        continue-on-error: true
        run: |
          python3 -m venv /tmp/sgenv
          /tmp/sgenv/bin/pip install -q --upgrade pip semgrep
          /tmp/sgenv/bin/semgrep --config=auto --error --quiet \
            --sarif --output=semgrep-results.sarif . || true

      - name: Upload SAST results to DefectDojo
        if: always() && github.event_name == 'push'
        run: |
          [ -f semgrep-results.sarif ] || exit 0
          curl -sf -X POST "https://dojo.gandetl.com/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "file=@semgrep-results.sarif" \
            -F "product_name=WozingaGroup" \
            -F "engagement_name=${{ env.REPO_NAME }}" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            || echo "DefectDojo upload failed (non-blocking)"

  # ── Build gates ────────────────────────────────────────────────────────────
  # The scan job above is deliberately build-free (it also serves repos with no
  # toolchain). This job supplies the gates that need one: a compiled artifact,
  # a green test suite, and an SBOM of what actually went into the binary.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # zmq-sys vendors libzmq and compiles it from source, and openssl is
      # vendored too — so a C/C++ toolchain and perl are required, but no
      # system libzmq or libssl-dev.
      - name: Build toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config perl cmake curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Compile the artifact
        run: cargo build --release --locked

      - name: Run the test suite
        run: cargo test --release --locked

      - name: Software bill of materials
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft dir:. -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
          echo "SBOM components: $(python3 -c "import json;print(len(json.load(open('sbom.cdx.json')).get('components',[])))")"

      # v4 refuses to run here: @actions/artifact v2 rejects GHES-like backends,
      # which is how Forgejo Actions presents. v3 uses the older artifact API
      # that Forgejo does implement.
      - name: Publish build outputs
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: fix_server-${{ github.sha }}
          path: |
            target/release/fix_server
            target/release/fix_console
            target/release/shadow_report
            sbom.cdx.json
            sbom.spdx.json

  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck
      - name: bash -n
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/deploy-poll.sh
          bash -n scripts/deploy-lib.sh
          bash -n scripts/rollback-drill.sh
          bash -n scripts/crash-loop-fix_server.sh
      - name: shellcheck
        run: |
          shellcheck -x --severity=warning \
            scripts/deploy.sh \
            scripts/deploy-poll.sh \
            scripts/deploy-lib.sh \
            scripts/rollback-drill.sh \
            scripts/crash-loop-fix_server.sh
      - name: py_compile parser
        run: python3 -m py_compile scripts/rollback-drill-parse-sessions.py
      - name: example config byte-copy
        run: cmp -s config.example.toml scripts/config.example.toml
