[package]
name = "fix_server"
version = "0.1.0"
edition = "2021"

[lib]
name = "fix_server"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.11", features = ["json"], default-features = false }
hmac = "0.12"
sha2 = "0.10"
zmq = "0.10"
tokio-stream = "0.1"
arc-swap = "1.7"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
kxkdb = { version = "0.1", features = ["ipc"] }
regex = "1"
# Vendored so the build doesn't depend on system OpenSSL dev headers/pkg-config being present.
openssl = { version = "0.10", features = ["vendored"] }

[[bin]]
name = "fix_server"
path = "src/main.rs"

[[bin]]
name = "fix_console"
path = "src/bin/console.rs"

[profile.release]
opt-level = 3
lto = true
