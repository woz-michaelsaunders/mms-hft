# PRD3 PrivateLink template — docs, not deployed.
# Copy to config.prd3.toml (NOT config.toml — that is UAT). Fill CompIDs, export
# CRYPTOCOM_PRD3_API_KEY / CRYPTOCOM_PRD3_API_SECRET.
# chmod 0600 config.prd3.toml
# Never commit secrets. Export named env vars; no defaults unlike KDB_HOST.
#
# Live start (`fix_server --config config.prd3.toml`) is a production cutover,
# not a dry run. Including the OM row means a live start will spawn order entry
# (dashboard bind is OM ∧ primary MD). Run this first:
#   fix_server --preflight --config config.prd3.toml
#
# Primary-book contract: the first role = "market_data" row is autosave / ZMQ.
# Keep BTC 34402 first among MD. Do not put ETH first.
# Adding a session = append [[sessions]] + restart, zero main.rs change.
# host is a hostname, NOT a URL — do not paste tcp://…
#
# TLS is opt-in per [[sessions]] row and defaults off (omit `tls`, or tls = false).
# Plain TCP + TCP_NODELAY is unchanged until a venue requires an encrypted socket:
#   tls = true
#   tls_ca_path = "certs/venue-ca.pem"     # optional exclusive trust-anchor PEM/DER
#   tls_server_name = "fix.example.com"    # optional SNI / hostname verify (defaults to host)
# Do not set tls = true here until the venue confirms the PrivateLink TLS requirement.

[subscriptions]
symbols = ["BTC_USDT", "BTC_USD", "BTCUSD-PERP"]

[credentials.PRD3]
api_key_env    = "CRYPTOCOM_PRD3_API_KEY"
api_secret_env = "CRYPTOCOM_PRD3_API_SECRET"

[[sessions]]
name             = "prd3_om"
role             = "order_management"
host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
port             = 31302
sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
credentials_ref  = "PRD3"

[[sessions]]
name             = "prd3_md_btc"
role             = "market_data"
host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
port             = 34402
sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
credentials_ref  = "PRD3"
symbol_routing   = "all"   # first MD row = primary book

[[sessions]]
name             = "prd3_md_eth"
role             = "market_data"
host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
port             = 34403
sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
credentials_ref  = "PRD3"
symbol_routing   = "all"

[[sessions]]
name             = "prd3_md_others_34405"
role             = "market_data"
host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
port             = 34405
sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
credentials_ref  = "PRD3"
symbol_routing   = { first_char_ranges = ["0-9", "A-D"] }

[[sessions]]
