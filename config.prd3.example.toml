# host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
# port             = 31302
# sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
# target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
# credentials_ref  = "PRD3"
# NOT ENABLED — order entry pending separate approval

[[sessions]]
name             = "prd3_md_btc"
role             = "market_data"
host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
port             = 34402
sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
credentials_ref  = "PRD3"
symbol_routing   = "all"   # first MD row = primary book

[[sessions]]
name             = "prd3_md_eth"
role             = "market_data"
host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
port             = 34403
sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
credentials_ref  = "PRD3"
symbol_routing   = "all"

[[sessions]]
