port             = 34406
sender_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_SENDER"
target_comp_id   = "REPLACE_WITH_VENUE_ASSIGNED_TARGET"
credentials_ref  = "PRD3"
symbol_routing   = { first_char_ranges = ["E-M"] }

[[sessions]]
name             = "prd3_md_others_34407"
role             = "market_data"
host             = "vpce-07bb726a65816b33f-2nhnv7ig.vpce-svc-0493a3dfb1a2d0d6a.ap-northeast-1.vpce.amazonaws.com"
